name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          version = json.loads(Path('mygo.json').read_text(encoding='utf-8'))['version']
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit('Tag must match the version in mygo.json')
          notes = Path('docs/releases') / f'{version}.md'
          if not notes.read_text(encoding='utf-8').strip():
              raise SystemExit(f'Release notes are empty: {notes}')
          PY

  test:
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...

  build:
    needs: [validate, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/arm64
            target: darwin-arm64
          - os: windows-latest
            platform: windows/amd64
            target: windows-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and package
        shell: bash
        run: go tool mygo build -platform '${{ matrix.platform }}' -o dist
      - name: Collect required packages
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          case "$TARGET" in
            darwin-arm64)
              cp dist/"$TARGET"/*.dmg release-assets/
              ;;
            windows-amd64)
              cp dist/"$TARGET"/*-setup-*.exe release-assets/
              ;;
            *)
              echo "Unsupported release target: $TARGET" >&2
              exit 1
              ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.target }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          path: release-assets/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: release-assets
      - name: Publish packages and release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes="docs/releases/${RELEASE_TAG#v}.md"
          prerelease=false
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease=true
          fi
          # A draft prevents a failed upload from exposing a partial release.
          gh release create "$RELEASE_TAG" \
            --verify-tag --draft \
            --title "MyJson $RELEASE_TAG" \
            --notes-file "$notes"
          gh release upload "$RELEASE_TAG" release-assets/*
          gh release edit "$RELEASE_TAG" \
            --title "MyJson $RELEASE_TAG" \
            --notes-file "$notes" \
            --prerelease="$prerelease" \
            --draft=false
